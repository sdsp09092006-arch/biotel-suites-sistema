<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta — Biotel Suites</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

    <main class="auth-wrapper">
        <div class="auth-card" style="max-width: 520px;">

            <!-- ============================================ -->
            <!-- HEADER -->
            <!-- ============================================ -->
            <header class="auth-header">
                <div class="auth-logo">BS</div>
                <h1 class="auth-title">Crear cuenta pública</h1>
                <p class="auth-subtitle">Regístrese para reservar y gestionar su estadía</p>

                <!-- Badge de rol por defecto -->
                <div style="margin-top: 1rem;">
                <label class="form-label">Rol en el hotel *</label>
                <select id="regRol" class="form-select">
                <option value="Recepcionista">Recepcionista</option>
                <option value="Gerente">Gerente</option>
                </select>
                </div>
            </header>

            <!-- ============================================ -->
            <!-- FORMULARIO REGISTRO -->
            <!-- ============================================ -->
            <form id="registerForm" novalidate>

                <!-- Nombre completo -->
                <div class="form-group">
                    <label class="form-label" for="fullname">
                        Nombre completo <span class="required">*</span>
                    </label>
                    <div class="input-group">
                        <span class="input-icon">👤</span>
                        <input
                            type="text"
                            id="fullname"
                            name="fullname"
                            class="form-control"
                            placeholder="Ej: Juan Pérez Rodríguez"
                            autocomplete="name"
                            required
                        >
                    </div>
                    <span class="form-error" id="errorFullname"></span>
                </div>

                <!-- Cédula / RIF -->
                <div class="form-group">
                    <label class="form-label" for="document">
                        Cédula o RIF <span class="required">*</span>
                    </label>
                    <div class="input-group">
                        <span class="input-icon">🆔</span>
                        <input
                            type="text"
                            id="document"
                            name="document"
                            class="form-control"
                            placeholder="Ej: V-12345678"
                            required
                        >
                    </div>
                    <span class="form-hint">Formato: V-12345678, E-12345678 o J-123456789</span>
                    <span class="form-error" id="errorDocument"></span>
                </div>

                <!-- Correo electrónico -->
                <div class="form-group">
                    <label class="form-label" for="regEmail">
                        Correo electrónico <span class="required">*</span>
                    </label>
                    <div class="input-group">
                        <span class="input-icon">📧</span>
                        <input
                            type="email"
                            id="regEmail"
                            name="regEmail"
                            class="form-control"
                            placeholder="correo@ejemplo.com"
                            autocomplete="email"
                            required
                        >
                    </div>
                    <span class="form-error" id="errorEmail"></span>
                </div>

                <!-- Teléfono -->
                <div class="form-group">
                    <label class="form-label" for="phone">
                        Teléfono de contacto
                    </label>
                    <div class="input-group">
                        <span class="input-icon">📱</span>
                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            class="form-control"
                            placeholder="0412-1234567"
                            autocomplete="tel"
                        >
                    </div>
                </div>

                <!-- Contraseña -->
                <div class="form-group">
                    <label class="form-label" for="regPassword">
                        Contraseña <span class="required">*</span>
                    </label>
                    <div class="input-group">
                        <span class="input-icon">🔒</span>
                        <input
                            type="password"
                            id="regPassword"
                            name="regPassword"
                            class="form-control"
                            placeholder="Mínimo 6 caracteres"
                            autocomplete="new-password"
                            required
                        >
                        <button
                            type="button"
                            onclick="togglePass('regPassword', this)"
                            style="position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 1.1rem; color: var(--gray-400); padding: 0;"
                            title="Mostrar/ocultar"
                        >👁</button>
                    </div>
                    <span class="form-error" id="errorPassword"></span>
                </div>

                <!-- Confirmar contraseña -->
                <div class="form-group">
                    <label class="form-label" for="regConfirm">
                        Confirmar contraseña <span class="required">*</span>
                    </label>
                    <div class="input-group">
                        <span class="input-icon">🔒</span>
                        <input
                            type="password"
                            id="regConfirm"
                            name="regConfirm"
                            class="form-control"
                            placeholder="Repita la contraseña"
                            autocomplete="new-password"
                            required
                        >
                        <button
                            type="button"
                            onclick="togglePass('regConfirm', this)"
                            style="position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 1.1rem; color: var(--gray-400); padding: 0;"
                            title="Mostrar/ocultar"
                        >👁</button>
                    </div>
                    <span class="form-error" id="errorConfirm"></span>
                </div>

                <!-- Términos y condiciones -->
                <div class="form-check" style="margin-bottom: 1.5rem;">
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms">
                        Acepto los <a href="#">términos y condiciones</a> y la
                        <a href="#">política de privacidad</a> de Biotel Suites.
                    </label>
                </div>
                <span class="form-error" id="errorTerms" style="display: block; margin-top: -1rem; margin-bottom: 1rem;"></span>

                <!-- Botón Registrarse -->
                <button type="submit" class="btn btn-primary btn-lg btn-block">
                    Crear mi cuenta
                </button>

            </form>

            <!-- ============================================ -->
            <!-- FOOTER -->
            <!-- ============================================ -->
            <footer class="auth-footer">
                <p>¿Ya tienes cuenta?
                    <a href="login.html">Inicia sesión aquí</a>
                </p>
                <p style="margin-top: 0.5rem; font-size: 0.8rem;">
                    <a href="sistema_diseno.html" style="color: var(--gray-500);">
                        Ver sistema de diseño →
                    </a>
                </p>
            </footer>

        </div>
    </main>

    <!-- Contenedor de Toasts -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
    const API_URL = 'http://localhost/biotel-suites-sistema/api/auth';

    function togglePass(id, btn) {
        var input = document.getElementById(id);
        if (input.type === 'password') {
            input.type = 'text';
            btn.textContent = '🙈';
        } else {
            input.type = 'password';
            btn.textContent = '👁';
        }
    }

    document.getElementById('registerForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        var fullname = document.getElementById('fullname');
        var documentInput = document.getElementById('document');
        var email = document.getElementById('regEmail');
        var phone = document.getElementById('phone');
        var password = document.getElementById('regPassword');
        var confirm = document.getElementById('regConfirm');
        var terms = document.getElementById('terms');
        var rol = document.getElementById('regRol');
        var btnSubmit = this.querySelector('button[type="submit"]');

        document.querySelectorAll('.form-control').forEach(el => el.classList.remove('error'));
        document.querySelectorAll('.form-error').forEach(el => el.textContent = '');

        var valido = true;

        if (!fullname.value.trim() || fullname.value.trim().length < 3) {
            marcarError(fullname, 'errorFullname', 'Nombre obligatorio.');
            valido = false;
        }

        var cedulaRegex = /^[VEJvej]-?\d{6,10}$/;
        if (!documentInput.value.trim() || !cedulaRegex.test(documentInput.value.trim())) {
            marcarError(documentInput, 'errorDocument', 'Cédula inválida.');
            valido = false;
        }

        var emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!email.value.trim() || !emailRegex.test(email.value.trim())) {
            marcarError(email, 'errorEmail', 'Correo inválido.');
            valido = false;
        }

        if (!password.value || password.value.length < 6) {
            marcarError(password, 'errorPassword', 'Contraseña mínimo 6 caracteres.');
            valido = false;
        }

        if (password.value !== confirm.value) {
            marcarError(confirm, 'errorConfirm', 'Las contraseñas no coinciden.');
            valido = false;
        }

        if (!terms.checked) {
            document.getElementById('errorTerms').textContent = '⚠ Debe aceptar los términos.';
            valido = false;
        }

        if (!valido) {
            showToast('danger', 'Error en el registro', 'Verifica los campos marcados.');
            return;
        }

        btnSubmit.disabled = true;
        btnSubmit.textContent = '⏳ Registrando...';

        try {
            const response = await fetch(API_URL + '/registro', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    nombre: fullname.value.trim(),
                    email: email.value.trim(),
                    password: password.value,
                    rol: rol ? rol.value : 'Recepcionista',
                    cedula: documentInput.value.trim(),
                    telefono: phone.value.trim()
                })
            });

            const data = await response.json();

            if (response.ok && data.success) {
                showToast('success', '¡Registro exitoso!', data.message);
                setTimeout(function() {
                    window.location.href = 'login.html';
                }, 2000);
            } else {
                showToast('danger', 'Error al registrar', data.message || 'Verifica los datos.');
            }
        } catch (error) {
            console.error(error);
            showToast('danger', 'Error de conexión', 'No se pudo conectar.');
        } finally {
            btnSubmit.disabled = false;
            btnSubmit.textContent = 'Crear mi cuenta';
        }
    });

    function marcarError(input, errorId, mensaje) {
        input.classList.add('error');
        document.getElementById(errorId).textContent = '⚠ ' + mensaje;
    }

    function showToast(type, title, message) {
        var container = document.getElementById('toastContainer');
        var seconds = 5;
        var icons = { success: '✓', danger: '✕', warning: '⚠', info: 'ℹ' };

        var toast = document.createElement('div');
        toast.className = 'toast toast-' + type;
        toast.innerHTML =
            '<span class="toast-icon">' + icons[type] + '</span>' +
            '<div class="toast-content">' +
                '<div class="toast-title">' + title + '</div>' +
                '<p class="toast-message">' + message + '</p>' +
            '</div>' +
            '<button class="toast-close" onclick="this.parentElement.remove()">×</button>' +
            '<span class="toast-timer">' + seconds + 's</span>';

        container.appendChild(toast);

        var timerEl = toast.querySelector('.toast-timer');
        var interval = setInterval(function() {
            seconds--;
            timerEl.textContent = seconds + 's';
            if (seconds <= 0) {
                clearInterval(interval);
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(120%)';
                setTimeout(function() { toast.remove(); }, 300);
            }
        }, 1000);
    }
</script>

</body>
</html>
